apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-dev
  template:
    metadata:
      labels:
        app: backend-dev
    spec:
      containers:
        - name: backend
          image: backend-dev:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: media-storage
              mountPath: /app/static/images
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: backend-media-pvc


